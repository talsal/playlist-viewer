<style>
  :root{
    --bg:#0f1115;
    --bg2:#14161c;
    --card:#181b22;
    --card-hover:#20242e;
    --accent:#e11d48;
    --accent2:#f59e0b;
    --text:#f1f1f3;
    --muted:#9aa0ab;
    --border:#262a33;
  }
  :root[data-theme="light"]{
    --bg:#f7f7f9;
    --bg2:#eceef2;
    --card:#ffffff;
    --card-hover:#f1f2f5;
    --accent:#e11d48;
    --accent2:#c2740a;
    --text:#1a1c22;
    --muted:#6b7280;
    --border:#e2e4ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    color:var(--text);
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  header{
    position:relative;
    padding:32px 24px 16px;
    text-align:center;
  }
  .theme-toggle{
    position:absolute;
    top:24px;
    left:20px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:1.1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .theme-toggle:hover{background:var(--card-hover); transform:scale(1.06);}
  header h1{
    margin:0 0 6px;
    font-size:2rem;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{color:var(--muted);margin:0;}
  header p.stats{margin-top:6px;font-size:.9rem;opacity:.85;}

  .categories{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:20px 16px 0;
  }
  .category-chip{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--muted);
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
    font-size:0.85rem;
    transition:transform .1s ease, box-shadow .1s ease, background .15s ease, color .15s ease;
    box-shadow:0 3px 0 var(--border), 0 4px 6px rgba(0,0,0,.15);
  }
  .category-chip:hover{background:var(--card-hover); color:var(--text); transform:translateY(-1px); box-shadow:0 4px 0 var(--border), 0 6px 8px rgba(0,0,0,.18);}
  .category-chip:active{transform:translateY(3px); box-shadow:0 0 0 var(--border), 0 1px 2px rgba(0,0,0,.15);}
  .category-chip.active{
    background:var(--accent2);
    border-color:var(--accent2);
    color:#fff;
    font-weight:600;
    box-shadow:0 3px 0 color-mix(in srgb, var(--accent2) 60%, black), 0 4px 6px rgba(0,0,0,.2);
  }
  .category-chip.active:hover{box-shadow:0 4px 0 color-mix(in srgb, var(--accent2) 60%, black), 0 6px 8px rgba(0,0,0,.22);}
  .category-chip.active:active{box-shadow:0 0 0 color-mix(in srgb, var(--accent2) 60%, black), 0 1px 2px rgba(0,0,0,.15);}

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    padding:14px 16px;
  }
  .tab{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
    font-size:0.95rem;
    transition:transform .1s ease, box-shadow .1s ease, background .15s ease;
    box-shadow:0 3px 0 var(--border), 0 4px 6px rgba(0,0,0,.15);
  }
  .tab:hover{background:var(--card-hover); transform:translateY(-1px); box-shadow:0 4px 0 var(--border), 0 6px 8px rgba(0,0,0,.18);}
  .tab:active{transform:translateY(3px); box-shadow:0 0 0 var(--border), 0 1px 2px rgba(0,0,0,.15);}
  .tab.active{
    background:var(--accent);
    border-color:var(--accent);
    font-weight:600;
    box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 60%, black), 0 4px 6px rgba(0,0,0,.2);
  }
  .tab.active:hover{box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 60%, black), 0 6px 8px rgba(0,0,0,.22);}
  .tab.active:active{box-shadow:0 0 0 color-mix(in srgb, var(--accent) 60%, black), 0 1px 2px rgba(0,0,0,.15);}

  .search-bar{
    max-width:480px;
    margin:0 auto 14px;
    padding:0 16px;
  }
  .search-bar input{
    width:100%;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:1rem;
  }
  .search-bar input::placeholder{color:var(--muted);}

  .sort-bar{
    max-width:480px;
    margin:0 auto 24px;
    padding:0 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .sort-bar label{
    color:var(--muted);
    font-size:0.85rem;
  }
  .sort-bar select{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:0.9rem;
    cursor:pointer;
  }
  .view-toggle{
    display:flex;
    gap:4px;
    margin-inline-start:6px;
  }
  .view-btn{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-size:1rem;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .view-btn:hover{background:var(--card-hover);}
  .view-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .grid.view-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:820px;
  }
  .grid.view-list .song-card{
    display:flex;
    flex-direction:row;
    align-items:center;
  }
  .grid.view-list .song-card:hover{
    transform:none;
  }
  .grid.view-list .thumb-wrap{
    width:150px;
    flex-shrink:0;
    aspect-ratio:16/9;
  }
  .grid.view-list .song-info{
    flex:1;
    min-width:0;
    padding:10px 14px;
  }
  .grid.view-list .song-info h3{
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .playlist-title{
    text-align:center;
    color:var(--muted);
    font-size:0.95rem;
    margin-bottom:18px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
    padding:0 24px 60px;
    max-width:1200px;
    margin:0 auto;
  }
  .load-more-btn{
    grid-column:1 / -1;
    justify-self:center;
    margin-top:8px;
    padding:10px 24px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:.95rem;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .load-more-btn:hover{background:var(--card-hover); transform:scale(1.03);}
  .song-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .song-card:hover{
    transform:translateY(-4px);
    background:var(--card-hover);
    box-shadow:0 10px 24px rgba(0,0,0,.35);
  }
  .thumb-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
  }
  .thumb-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .play-badge{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.15);
    opacity:0;
    transition:opacity .15s ease;
  }
  .song-card:hover .play-badge{opacity:1;}
  .play-badge svg{width:52px;height:52px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
  .duration{
    position:absolute;
    bottom:6px;
    left:6px;
    background:rgba(0,0,0,0.8);
    color:#fff;
    font-size:0.75rem;
    padding:2px 6px;
    border-radius:4px;
  }
  .fav-btn{
    position:absolute;
    top:8px;
    left:8px;
    width:32px;
    height:32px;
    background:rgba(0,0,0,0.55);
    border:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:2;
    transition:background .15s ease, transform .1s ease;
  }
  .fav-btn:hover{background:rgba(0,0,0,0.75); transform:scale(1.08);}
  .fav-btn svg{width:17px;height:17px;}
  .fav-btn svg path{fill:none;stroke:#fff;stroke-width:1.6;stroke-linejoin:round;}
  .fav-btn.active svg path{fill:var(--accent2);stroke:var(--accent2);}
  .song-info{padding:12px 14px 16px;}
  .song-info h3{
    margin:0 0 4px;
    font-size:0.98rem;
    line-height:1.35;
    font-weight:600;
  }
  .song-info p{
    margin:0;
    color:var(--muted);
    font-size:0.82rem;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 16px;
  }

  /* Modal */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    width:100%;
    max-width:800px;
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
  }
  .modal-header h3{margin:0;font-size:1rem;}
  .modal-close{
    background:none;
    border:none;
    color:var(--muted);
    font-size:1.4rem;
    cursor:pointer;
    line-height:1;
  }
  .modal-close:hover{color:var(--text);}
  .video-frame-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
  }
  .video-frame-wrap iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  .modal-footer{
    padding:14px 18px 18px;
  }
  .modal-footer a{
    color:var(--accent2);
    text-decoration:none;
    font-size:0.9rem;
  }
  .modal-footer a:hover{text-decoration:underline;}
  .kbd-hint{
    margin:10px 0 0;
    color:var(--muted);
    font-size:0.75rem;
  }
  .modal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .nav-btn{
    background:var(--card-hover);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.88rem;
  }
  .nav-btn:hover{background:var(--border);}
  .nav-btn:disabled{opacity:0.4;cursor:default;}
  .nav-btn:disabled:hover{background:var(--card-hover);}
  .autoplay-status{
    color:var(--muted);
    font-size:0.82rem;
    flex:1;
    text-align:center;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    padding:20px;
  }
</style>
</head>

let currentCategory = "all";

const FAVORITES_ID = "__favorites__";
const FAVORITES_KEY = "playlist-viewer-favorites";

function loadFavorites(){
  try{
    const raw = localStorage.getItem(FAVORITES_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch(e){
    return new Set();
  }
}
function saveFavorites(){
  localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
}
function toggleFavorite(videoId){
  if(favorites.has(videoId)) favorites.delete(videoId);
  else favorites.add(videoId);
  saveFavorites();
  renderTabs();
  renderGrid();
}
function getFavoriteSongs(){
  const result = [];
  playlists.forEach(pl => {
    pl.songs.forEach(song => {
      if(favorites.has(song.videoId)){
        result.push({ ...song, channel: pl.channel, playlistName: pl.name });
      }
    });
  });
  return result;
}

function getAllSongs(){
  const result = [];
  playlists.forEach(pl => {
    pl.songs.forEach(song => {
      result.push({ ...song, channel: pl.channel, playlistName: pl.name });
    });
  });
  return result;
}

const favorites = loadFavorites();

const tabsEl = document.getElementById("tabs");
const gridEl = document.getElementById("grid");
const titleEl = document.getElementById("playlistTitle");
const searchEl = document.getElementById("search");
const sortEl = document.getElementById("sortSelect");
const viewGridBtn = document.getElementById("viewGridBtn");
const viewListBtn = document.getElementById("viewListBtn");

const VIEW_KEY = "playlist-viewer-view";
function loadView(){
  try { return localStorage.getItem(VIEW_KEY) === "list" ? "list" : "grid"; }
  catch(e){ return "grid"; }
}
function applyView(view){
  gridEl.classList.toggle("view-list", view === "list");
  viewGridBtn.classList.toggle("active", view === "grid");
  viewListBtn.classList.toggle("active", view === "list");
}
let currentView = loadView();
applyView(currentView);
viewGridBtn.onclick = () => {
  currentView = "grid";
  applyView(currentView);
  try { localStorage.setItem(VIEW_KEY, currentView); } catch(e){}
};
viewListBtn.onclick = () => {
  currentView = "list";
  applyView(currentView);
  try { localStorage.setItem(VIEW_KEY, currentView); } catch(e){}
};

function isSearching(){
  return searchEl.value.trim().length > 0;
}

function durationToSeconds(d){
  if(!d) return 0;
  const parts = d.split(":").map(Number);
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if(parts.length === 2) return parts[0]*60 + parts[1];
  return parts[0] || 0;
}

function applySort(songs){
  const mode = sortEl.value;
  const arr = songs.slice();
  if(mode === "title-asc"){
    arr.sort((a, b) => a.title.localeCompare(b.title, "he"));
  } else if(mode === "duration-asc"){
    arr.sort((a, b) => durationToSeconds(a.duration) - durationToSeconds(b.duration));
  } else if(mode === "duration-desc"){
    arr.sort((a, b) => durationToSeconds(b.duration) - durationToSeconds(a.duration));
  }
  return arr;
}

const categoriesEl = document.getElementById("categories");

function renderCategories(){
  categoriesEl.innerHTML = "";
  CATEGORY_LABELS.forEach(cat => {
    const count = cat.key === "all" ? playlists.length : playlists.filter(pl => categoryOf(pl) === cat.key).length;
    const chip = document.createElement("button");
    chip.className = "category-chip" + (currentCategory === cat.key ? " active" : "");
    chip.textContent = `${cat.label} (${count})`;
    chip.onclick = () => {
      currentCategory = cat.key;
      const visible = playlists.filter(pl => currentCategory === "all" || categoryOf(pl) === currentCategory);
      if(currentPlaylistId !== FAVORITES_ID && !visible.some(pl => pl.id === currentPlaylistId) && visible.length){
        currentPlaylistId = visible[0].id;
      }
      searchEl.value = "";
      visibleLimit = PAGE_SIZE;
      renderCategories();
      renderTabs();
      renderGrid();
    };
    categoriesEl.appendChild(chip);
  });
}

function renderTabs(){
  tabsEl.innerHTML = "";
  const searching = isSearching();
  const visiblePlaylists = playlists.filter(pl => currentCategory === "all" || categoryOf(pl) === currentCategory);

  const favBtn = document.createElement("button");
  favBtn.className = "tab" + (!searching && currentPlaylistId === FAVORITES_ID ? " active" : "");
  favBtn.textContent = `⭐ מועדפים (${favorites.size})`;
  favBtn.onclick = () => { currentPlaylistId = FAVORITES_ID; searchEl.value=""; visibleLimit = PAGE_SIZE; renderTabs(); renderGrid(); };
  tabsEl.appendChild(favBtn);

  visiblePlaylists.forEach(pl => {
    const btn = document.createElement("button");
    btn.className = "tab" + (!searching && pl.id === currentPlaylistId ? " active" : "");
    btn.textContent = `${pl.name} (${pl.songs.length})`;
    btn.onclick = () => { currentPlaylistId = pl.id; searchEl.value=""; visibleLimit = PAGE_SIZE; renderTabs(); renderGrid(); };
    tabsEl.appendChild(btn);
  });
}

function renderGrid(){
  gridEl.innerHTML = "";

  const q = searchEl.value.trim();
  const searching = q.length > 0;

  let songs;
  if(searching){
    songs = getAllSongs().filter(s => s.title.includes(q));
    titleEl.textContent = `${songs.length} תוצאות עבור "${q}" · בכל הפלייליסטים`;
  } else if(currentPlaylistId === FAVORITES_ID){
    songs = getFavoriteSongs();
    titleEl.textContent = `${songs.length} שירים מועדפים`;
  } else {
    const pl = playlists.find(p => p.id === currentPlaylistId);
    if(!pl){ titleEl.textContent = ""; return; }
    songs = pl.songs.map(s => ({ ...s, channel: pl.channel }));
    titleEl.textContent = `${pl.channel} · ${pl.songs.length} שירים`;
  }

  songs = applySort(songs);

  if(songs.length === 0){
    const msg = searching
      ? `לא נמצאו תוצאות עבור "${q}"`
      : currentPlaylistId === FAVORITES_ID
        ? "עדיין אין שירים מועדפים - לחצו על ⭐ בכרטיס של שיר כדי להוסיף אותו לכאן"
        : "לא נמצאו שירים תואמים";
    gridEl.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  const visibleSongs = songs.slice(0, visibleLimit);
  visibleSongs.forEach((song, idx) => {
    const isFav = favorites.has(song.videoId);
    const card = document.createElement("div");
    card.className = "song-card";
    card.onclick = () => openModal(song, idx, songs);
    card.innerHTML = `
      <div class="thumb-wrap">
        <img loading="lazy" src="https://img.youtube.com/vi/${song.videoId}/hqdefault.jpg" alt="${song.title}">
        <button class="fav-btn${isFav ? " active" : ""}" title="הוסף/הסר ממועדפים">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>
        </button>
        <div class="play-badge">
          <svg viewBox="0 0 68 48"><path d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,.13,34,0,34,0S12.21,.13,6.9,1.55 C3.97,2.33,2.27,4.81,1.48,7.74C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z" fill="#e11d48"></path><path d="M 45,24 27,14 27,34" fill="#fff"></path></svg>
        </div>
        <span class="duration">${song.duration || ""}</span>
      </div>
      <div class="song-info">
        <h3>${song.title}</h3>
        <p>${song.playlistName || song.channel}</p>
      </div>
    `;
    card.querySelector(".fav-btn").onclick = (e) => {
      e.stopPropagation();
      toggleFavorite(song.videoId);
    };
    gridEl.appendChild(card);
  });

  if(songs.length > visibleSongs.length){
    const loadMoreBtn = document.createElement("button");
    loadMoreBtn.className = "load-more-btn";
    loadMoreBtn.textContent = `טען עוד (${songs.length - visibleSongs.length} נותרו)`;
    loadMoreBtn.onclick = () => { visibleLimit += PAGE_SIZE; renderGrid(); };
    gridEl.appendChild(loadMoreBtn);
  }
}

// ---- Modal & player ----
const overlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalLink = document.getElementById("modalLink");
const modalClose = document.getElementById("modalClose");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const autoplayStatus = document.getElementById("autoplayStatus");

let currentSongList = [];
let currentSongIndex = -1;
let ytPlayer = null;
let playerReady = false;
let pendingVideoId = null;

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player("modalFrame", {
    height: "100%",
    width: "100%",
    playerVars: { autoplay: 1, rel: 0 },
    events: {
      onReady: () => {
        playerReady = true;
        if(pendingVideoId){
          ytPlayer.loadVideoById(pendingVideoId);
          pendingVideoId = null;
        }
      },
      onStateChange: (e) => {
        if(e.data === YT.PlayerState.ENDED && overlay.classList.contains("open")){
          playRelative(1);
        }
      }
    }
  });
}

function loadVideo(videoId){
  if(playerReady && ytPlayer && ytPlayer.loadVideoById){
    ytPlayer.loadVideoById(videoId);
  } else {
    pendingVideoId = videoId;
  }
}

function updateNavButtons(){
  const hasList = currentSongList.length > 0;
  prevBtn.disabled = !hasList || currentSongIndex <= 0;
  nextBtn.disabled = !hasList || currentSongIndex >= currentSongList.length - 1;
  autoplayStatus.textContent = hasList ? `${currentSongIndex + 1} מתוך ${currentSongList.length}` : "";
}

function openModal(song, index = 0, list = [song]){
  currentSongList = list;
  currentSongIndex = index;
  modalTitle.textContent = song.title;
  modalLink.href = `https://www.youtube.com/watch?v=${song.videoId}`;
  overlay.classList.add("open");
  loadVideo(song.videoId);
  updateNavButtons();
}
function playRelative(delta){
  const nextIndex = currentSongIndex + delta;
  if(nextIndex < 0 || nextIndex >= currentSongList.length){
    if(delta > 0) closeModal();
    return;
  }
  openModal(currentSongList[nextIndex], nextIndex, currentSongList);
}
function togglePlayPause(){
  if(!playerReady || !ytPlayer || !ytPlayer.getPlayerState) return;
  const state = ytPlayer.getPlayerState();
  if(state === YT.PlayerState.PLAYING){
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }
}
function closeModal(){
  overlay.classList.remove("open");
  if(playerReady && ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  currentSongIndex = -1;
  currentSongList = [];
}
modalClose.onclick = closeModal;
prevBtn.onclick = () => playRelative(-1);
nextBtn.onclick = () => playRelative(1);
overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "select" || tag === "textarea") return;

  if(e.key === "Escape"){ closeModal(); return; }

  if(!overlay.classList.contains("open")) return;

  if(e.key === " " || e.code === "Space"){
    e.preventDefault();
    togglePlayPause();
  } else if(e.key === "ArrowRight"){
    e.preventDefault();
    playRelative(1);
  } else if(e.key === "ArrowLeft"){
    e.preventDefault();
    playRelative(-1);
  }
});

searchEl.addEventListener("input", () => { visibleLimit = PAGE_SIZE; renderTabs(); renderGrid(); });
sortEl.addEventListener("change", () => { visibleLimit = PAGE_SIZE; renderGrid(); });

// ---- Theme toggle ----
const THEME_KEY = "playlist-viewer-theme";
const themeToggleBtn = document.getElementById("themeToggle");

function applyTheme(theme){
  if(theme === "light"){
    document.documentElement.setAttribute("data-theme", "light");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  themeToggleBtn.textContent = theme === "light" ? "🌙" : "☀️";
  themeToggleBtn.title = theme === "light" ? "עבור למצב כהה" : "עבור למצב בהיר";
}

let currentTheme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
applyTheme(currentTheme);

themeToggleBtn.onclick = () => {
  currentTheme = currentTheme === "light" ? "dark" : "light";
  applyTheme(currentTheme);
  try { localStorage.setItem(THEME_KEY, currentTheme); } catch(e){}
};

function renderStats(){
  const totalSongs = playlists.reduce((sum, pl) => sum + pl.songs.length, 0);
  document.getElementById("statsLine").textContent =
    `${playlists.length} פלייליסטים · ${totalSongs} שירים`;
}

renderCategories();
renderTabs();
renderGrid();
renderStats();
</script>
